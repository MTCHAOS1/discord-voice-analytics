name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      RUN_TEMP_POSTGRES_TESTS: '1'
      HF_HUB_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-dashboard.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dashboard.txt
          python -m pip check

      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16

      - name: Run all tests including temporary PostgreSQL
        run: python -m unittest discover -s tests -v

  dashboard:
    name: Dashboard / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test dashboard interactions
        run: node --test tests/test_dashboard_ui.cjs
